<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="594px" preserveAspectRatio="none" style="width:620px;height:594px;background:#FFFFFF;" version="1.1" viewBox="0 0 620 594" width="620px" zoomAndPan="magnify"><defs/><g><ellipse cx="289.6675" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="351.0957" x="114.1196" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.2598" x="124.1196" y="71.1387">Обновление кадра игры (метод update);</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="225.7676" x="124.1196" y="85.1074">:Получение текущей позиции шара</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="101.5137" x="353.7017" y="85.1074">b.getPosition()</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="212.4805" x="183.4272" y="166.9219"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.709" x="193.4272" y="188.0605">Выравнивание шара по оси Y:</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="192.4805" x="193.4272" y="202.0293">b.getPosition().y = FLOOR_Y</text><polygon fill="#FFFFFF" points="207.7036,234.8594,371.6313,234.8594,383.6313,246.8594,371.6313,258.8594,207.7036,258.8594,195.7036,246.8594,207.7036,234.8594" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.9277" x="207.7036" y="251.0137">firstBallReturned == false?</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="133.3887" x="62.3149" y="244.0293">Да (Это первый шар)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.7383" x="383.6313" y="244.0293">Нет (Шар упал позже)</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="183.1953" x="50.7002" y="268.8594"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.9141" x="60.7002" y="289.998">Установка флага:</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="163.1953" x="60.7002" y="303.9668">firstBallReturned = true</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="262.5957" x="11" y="351.7969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.9648" x="21" y="372.9355">Фиксация точки сбора:</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="242.5957" x="21" y="386.9043">nextStartPos = (b.getX(), FLOOR_Y)</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="234.9453" x="24.8252" y="419.7344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.8223" x="34.8252" y="440.873">Смена состояния:</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="214.9453" x="34.8252" y="454.8418">b.setStatus(BallState.WAITING)</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="286.8828" x="293.5957" y="268.8594"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="266.8828" x="303.5957" y="289.998">Смена состояния (возврат к точке сбора):</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="234.4219" x="303.5957" y="303.9668">b.setStatus(BallState.RETURNING)</text><polygon fill="#FFFFFF" points="289.6675,473.6719,301.6675,485.6719,289.6675,497.6719,277.6675,485.6719,289.6675,473.6719" style="stroke:#000000;stroke-width:0.5;"/><polygon fill="#FFFFFF" points="204.4692,117.9375,374.8657,117.9375,386.8657,129.9375,374.8657,141.9375,204.4692,141.9375,192.4692,129.9375,204.4692,117.9375" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="16.7285" x="293.6675" y="153.0762">Да</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.3965" x="204.4692" y="134.0918">b.getPosition().y &lt; FLOOR_Y</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="23.3965" x="386.8657" y="127.1074">Нет</text><polygon fill="#FFFFFF" points="289.6675,517.6719,301.6675,529.6719,289.6675,541.6719,277.6675,529.6719,289.6675,517.6719" style="stroke:#000000;stroke-width:0.5;"/><ellipse cx="289.6675" cy="572.6719" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="289.6675" cy="572.6719" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="289.6675" x2="289.6675" y1="30" y2="50"/><polygon fill="#181818" points="285.6675,40,289.6675,50,293.6675,40,289.6675,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="142.2979" x2="142.2979" y1="316.7969" y2="351.7969"/><polygon fill="#181818" points="138.2979,341.7969,142.2979,351.7969,146.2979,341.7969,142.2979,345.7969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="142.2979" x2="142.2979" y1="399.7344" y2="419.7344"/><polygon fill="#181818" points="138.2979,409.7344,142.2